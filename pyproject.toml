[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cmjsc"
version = "1.0.2"
description = "JSC cell-segmentation H5 -> CellSegmentations.zip / CellInstances.tsv / cell morphometry, with full provenance"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Sebastian Bludau"}]
dependencies = [
  "numpy>=1.24",
  "h5py>=3.8",
  "scikit-image>=0.22",
  "opencv-python-headless>=4.8",
  "tifffile>=2023.7",
  "imagecodecs>=2023.7",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cmjsc = "cmjsc.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
